name: release
on:
  push:
    branches:
      - master
jobs:
  build-and-deploy-to-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 18.17.0
      - run: npm install
      - run: npm run install-action
      - run: npm run build
        env:
          # GATSBY_EXCHANGE_PROXY_TOKEN 这里必须填 Worker 的 PROXY_READONLY_TOKEN
          # （只读，见 workers/exchange-proxy），不能填 PROXY_TRADE_TOKEN——这个值会
          # 被打进公开发布的 bundle，只读 token 泄露最多被人查一下历史仓位，
          # 不能拿去下单。
          GATSBY_EXCHANGE_PROXY_URL: ${{ secrets.GATSBY_EXCHANGE_PROXY_URL }}
          GATSBY_EXCHANGE_PROXY_TOKEN: ${{ secrets.GATSBY_EXCHANGE_PROXY_TOKEN }}
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_ACTION_DEPLOY_KEY}}
          publish_dir: ./public
